<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yield Data Probe — v2.3.4 pre-check</title>
<style>
body{background:#0f1115;color:#e6e6e6;font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:24px;max-width:760px;margin:auto}
h1{font-size:15px;letter-spacing:.06em} .muted{color:#9aa0a6} .ok{color:#4ade80} .err{color:#f87171} .warn{color:#eab308}
button{font-family:inherit;font-size:13px;padding:12px 20px;border-radius:6px;border:1px solid #374151;background:#1f2937;color:#e6e6e6;cursor:pointer;margin:6px 4px 6px 0}
input{font-family:inherit;font-size:12px;padding:8px;border-radius:4px;border:1px solid #374151;background:#111827;color:#e6e6e6;width:320px}
#log{white-space:pre-wrap;line-height:1.6;margin-top:14px;border:1px solid #374151;border-radius:6px;padding:12px;min-height:160px}
</style></head><body>
<h1>YIELD DATA PROBE — collector v2.3.4 pre-check</h1>
<div class="muted">Tests whether the key can reach (A) the Treasury Yields endpoint (latest),
(B) the DM backfill window (2024-07-08+), and (C) the I:IRX indices fallback.<br>
One-time use — delete from repo when done.</div><br>
<div>Polygon key: <input id="key" placeholder="loading from localStorage…"> <button onclick="saveKey()">Save</button></div>
<button onclick="runProbes()">▶ Run probes</button>
<div id="log">ready.</div>
<script>
const L = m => { document.getElementById('log').innerHTML += m + '\n'; };
const $k = document.getElementById('key');
$k.value = localStorage.getItem('polygon_key') || '';
function saveKey(){ localStorage.setItem('polygon_key', $k.value.trim()); L('key saved to localStorage.'); }
async function tryFetch(path) {
  for (const host of ['https://api.polygon.io', 'https://api.massive.com']) {
    try {
      const r = await fetch(host + path + (path.includes('?') ? '&' : '?') + 'apiKey=' + encodeURIComponent($k.value.trim()));
      const body = await r.json().catch(() => null);
      if (r.ok && body) return { host, status: r.status, body };
      if (r.status === 401 || r.status === 403) return { host, status: r.status, body };
      // 404 → try next host
    } catch (e) { /* network/CORS → try next host */ }
  }
  return null;
}
function pickYieldFields(row) {
  if (!row) return '—';
  const keys = Object.keys(row);
  const m3 = keys.find(k => /3[_ ]?month/i.test(k));
  return 'fields: [' + keys.join(', ') + ']' + (m3 ? '  →  3-month field: ' + m3 + ' = ' + row[m3] : '  →  ⚠ no 3-month field found');
}
async function runProbes() {
  document.getElementById('log').innerHTML = '';
  if (!$k.value.trim()) { L('<span class="err">no key — paste and Save first</span>'); return; }

  L('── PROBE A · /fed/v1/treasury-yields (latest 3) ──');
  let a = await tryFetch('/fed/v1/treasury-yields?limit=3&sort=date.desc');
  if (a && a.status === 200 && a.body.results && a.body.results.length) {
    L('<span class="ok">✓ ' + a.host + ' · ' + a.body.results.length + ' rows</span>');
    L('latest: ' + JSON.stringify(a.body.results[0]).slice(0, 300));
    L(pickYieldFields(a.body.results[0]));
  } else L('<span class="err">✗ ' + (a ? a.host + ' HTTP ' + a.status + ' ' + JSON.stringify(a.body).slice(0,160) : 'unreachable on both hosts') + '</span>');

  L('\n── PROBE B · DM window coverage (2024-07-08 →) ──');
  let b = await tryFetch('/fed/v1/treasury-yields?date.gte=2024-07-08&limit=3&sort=date.asc');
  if (b && b.status === 200 && b.body.results && b.body.results.length) {
    L('<span class="ok">✓ earliest in window: ' + (b.body.results[0].date || JSON.stringify(b.body.results[0]).slice(0,80)) + '</span>');
  } else L('<span class="err">✗ window query failed: ' + (b ? 'HTTP ' + b.status : 'unreachable') + '</span>');

  L('\n── PROBE C · I:IRX indices fallback ──');
  let c = await tryFetch('/v2/aggs/ticker/I:IRX/range/1/day/2026-07-13/2026-07-20?adjusted=true&sort=desc&limit=3');
  if (c && c.status === 200 && c.body.results && c.body.results.length) {
    const r0 = c.body.results[0];
    L('<span class="ok">✓ I:IRX reachable · last close ' + r0.c + ' (÷10 = ' + (r0.c/10).toFixed(2) + '%)</span>');
  } else L('<span class="warn">— I:IRX not available (' + (c ? 'HTTP ' + c.status : 'unreachable') + ') — fine if Probe A passed</span>');

  L('\n── VERDICT ──');
  const aOK = a && a.status === 200 && a.body.results && a.body.results.length;
  const bOK = b && b.status === 200 && b.body.results && b.body.results.length;
  if (aOK && bOK) L('<span class="ok">✓ v2.3.4 uses /fed/v1/treasury-yields (3-month CMT) — full backfill available. Screenshot this and delete the file.</span>');
  else if (c && c.status === 200) L('<span class="warn">Treasury endpoint blocked — v2.3.4 falls back to I:IRX aggregates.</span>');
  else L('<span class="err">Neither source reachable on this key — v2.3.4 would need FRED DTB3 (keyless) instead.</span>');
}
</script></body></html>

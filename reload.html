async function preflight() {
  L('reading current live_trades\u2026');
  try {
    const r = await fetch(SB + '/live_trades?select=id,roll_credit,status&limit=1000', { headers: H });
    if (!r.ok) throw new Error('read ' + r.status);
    const rows = await r.json();
    const sum = rows.reduce((a, x) => a + (parseFloat(x.roll_credit) || 0), 0);
    L('current: <span class="warn">' + rows.length + ' rows \u00b7 $' + sum.toFixed(2) + '</span> \u2192 will be deleted');

async function reload_() {
  if (!confirm('Delete ALL live_trades rows and insert the 168 rebuilt rows?')) return;
  document.getElementById('run').disabled = true;
  try {
    L('deleting all rows\u2026');
    const d = await fetch(SB + '/live_trades?id=neq.__none__', { method: 'DELETE', headers: { ...H, 'Prefer': 'return=minimal' } });
    if (!d.ok) throw new Error('delete ' + d.status + ' ' + (await d.text()).slice(0, 120));
    L('\u2713 deleted');
    L('inserting ' + ROWS.length + ' rows\u2026');
    for (let i = 0; i < ROWS.length; i += 60) {
      const chunk = ROWS.slice(i, i + 60);
      const p = await fetch(SB + '/live_trades', { method: 'POST', headers: { ...H, 'Prefer': 'return=minimal' }, body: JSON.stringify(chunk) });
      if (!p.ok) throw new Error('insert chunk @' + i + ': ' + p.status + ' ' + (await p.text()).slice(0, 160));
      L('  \u2713 rows ' + (i + 1) + '\u2013' + (i + chunk.length));
    }
    L('<span class="ok">\u2713 INSERT complete</span>');
    document.getElementById('verify').disabled = false;
  } catch (e) {
    L('<span class="err">\u2717 ' + e.message + '</span>');
    L('Table may be partially loaded \u2014 re-run from Preflight (the reload is idempotent).');
    document.getElementById('run').disabled = false;
  }
}
async function verify() {
  try {
    const r = await fetch(SB + '/live_trades?select=id,roll_credit,status,sell_strike,sell_expiry,sell_contracts&limit=1000', { headers: H });
    const rows = await r.json();
    const sum = rows.reduce((a, x) => a + (parseFloat(x.roll_credit) || 0), 0);
    const wins = rows.filter(x => parseFloat(x.roll_credit) > 0).length;
    const open = rows.filter(x => x.status === 'open');
    const pass = rows.length === 168 && Math.abs(sum - 55160.51) < 0.01 && wins === 144 && open.length === 1;

      ' \u00b7 ' + wins + ' wins \u00b7 ' + open.length + ' open</span>  (expect 168 \u00b7 55160.51 \u00b7 144 \u00b7 1)');

      ' \u00b7 credit ' + open[0].roll_credit);
    if (pass) L('<span class="ok">\u2713 RELOAD CERTIFIED \u2014 delete reload.html from the repo now.</span>');

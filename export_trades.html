<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>live_trades Exporter</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --line: #2b3542;
    --text: #d7dee6; --dim: #7d8a99; --ok: #3fb96f; --warn: #e0a83a;
    --err: #e05a5a; --accent: #4a9edb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "SF Mono", Menlo, monospace;
    padding: 16px; max-width: 640px; margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin-bottom: 10px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; font-size: 14px;
  }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 8px;
    font: inherit; font-size: 15px; font-weight: 600;
    color: #fff; margin-top: 10px; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .35; }
  .b-pre { background: #2b6cb0; }
  .b-act { background: #2f855a; }
  .b-dl  { background: #6b46c1; }
  .b-cp  { background: #4a5568; }
  #log {
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
    color: var(--text); min-height: 40px;
  }
  .ok   { color: var(--ok); }
  .warn { color: var(--warn); }
  .err  { color: var(--err); }
  .dim  { color: var(--dim); }
</style>
</head>
<body>
  <h1>live_trades Exporter</h1>
  <div class="sub">Read-only · anon REST · Preflight → Export → Verify → Download · delete after use</div>

  <div class="panel">
    <h2>Connection</h2>
    <label for="key">Supabase anon key</label>
    <input type="password" id="key" placeholder="paste anon key" autocomplete="off">
    <button class="b-pre" id="btnPre" onclick="preflight()">1 · Preflight (count rows)</button>
  </div>

  <div class="panel">
    <h2>Export</h2>
    <button class="b-act" id="btnAct" onclick="doExport()" disabled>2 · Fetch all rows → build CSV</button>
    <button class="b-dl" id="btnDl" onclick="download()" disabled>3 · Download CSV</button>
    <button class="b-cp" id="btnCp" onclick="copyCsv()" disabled>Copy CSV to clipboard</button>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <div id="log">Waiting for preflight.</div>
  </div>

<script>
const SB = "https://pepdnkwytziegjvgkofq.supabase.co";
const TABLE = "live_trades";
const PAGE = 1000;

let expectedCount = null;
let rows = [];
let csvText = "";
let dateField = null;

const $ = id => document.getElementById(id);
const logEl = $("log");
let lines = [];
function log(msg, cls) {
  lines.push(cls ? `<span class="${cls}">${msg}</span>` : msg);
  logEl.innerHTML = lines.join("\n");
}
function resetLog() { lines = []; logEl.innerHTML = ""; }

// restore key if previously saved on this device
const saved = localStorage.getItem("supabase_anon");
if (saved) $("key").value = saved;

function headers() {
  const k = $("key").value.trim();
  return { "apikey": k, "Authorization": "Bearer " + k };
}

async function preflight() {
  const k = $("key").value.trim();
  if (!k) { resetLog(); log("No anon key entered.", "err"); return; }
  localStorage.setItem("supabase_anon", k);
  resetLog();
  log("Preflight: counting rows in " + TABLE + " …");
  try {
    const r = await fetch(`${SB}/rest/v1/${TABLE}?select=*`, {
      method: "HEAD",
      headers: { ...headers(), "Prefer": "count=exact", "Range": "0-0" }
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const cr = r.headers.get("content-range"); // e.g. 0-0/171
    expectedCount = cr ? parseInt(cr.split("/")[1], 10) : null;
    if (expectedCount == null || isNaN(expectedCount))
      throw new Error("count not returned (content-range: " + cr + ")");
    log(`✓ ${TABLE}: ${expectedCount} rows`, "ok");
    log("Ready to export.", "dim");
    $("btnAct").disabled = false;
  } catch (e) {
    log("✗ Preflight failed: " + e.message, "err");
    log("Check the anon key and RLS read policy on live_trades.", "dim");
  }
}

async function doExport() {
  $("btnAct").disabled = true;
  rows = []; csvText = ""; dateField = null;
  $("btnDl").disabled = true; $("btnCp").disabled = true;
  log("Fetching in pages of " + PAGE + " …");
  try {
    let from = 0;
    while (true) {
      const to = from + PAGE - 1;
      const r = await fetch(`${SB}/rest/v1/${TABLE}?select=*`, {
        headers: { ...headers(), "Range": `${from}-${to}` }
      });
      if (!r.ok && r.status !== 206) throw new Error("HTTP " + r.status + " at range " + from);
      const batch = await r.json();
      rows = rows.concat(batch);
      log(`  page ${from}-${to}: ${batch.length} rows (total ${rows.length})`, "dim");
      if (batch.length < PAGE) break;
      from += PAGE;
    }

    if (rows.length === 0) throw new Error("zero rows returned");

    // Column order: union of keys, first-row order preserved, extras appended
    const cols = [];
    for (const row of rows)
      for (const k of Object.keys(row))
        if (!cols.includes(k)) cols.push(k);

    // Sort by best available date-like field, ascending
    const candidates = ["trade_date", "date", "entry_date", "close_date", "ts", "created_at"];
    dateField = candidates.find(c => cols.includes(c)) || null;
    if (dateField) {
      rows.sort((a, b) => String(a[dateField] ?? "").localeCompare(String(b[dateField] ?? "")));
      log(`Sorted ascending by "${dateField}".`);
    } else {
      log("No date-like column found — export order is server order.", "warn");
    }

    // Build CSV
    const esc = v => {
      if (v === null || v === undefined) return "";
      let s = (typeof v === "object") ? JSON.stringify(v) : String(v);
      if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const out = [cols.join(",")];
    for (const row of rows) out.push(cols.map(c => esc(row[c])).join(","));
    csvText = out.join("\r\n");

    // Verify
    const match = (expectedCount === rows.length);
    log(match
        ? `✓ VERIFY: fetched ${rows.length} = preflight ${expectedCount}`
        : `✗ VERIFY MISMATCH: fetched ${rows.length}, preflight ${expectedCount}`,
        match ? "ok" : "err");
    log(`Columns (${cols.length}): ${cols.join(", ")}`, "dim");
    if (dateField) {
      log(`First ${dateField}: ${rows[0][dateField]}`, "dim");
      log(`Last  ${dateField}: ${rows[rows.length - 1][dateField]}`, "dim");
    }
    log(`CSV size: ${(csvText.length / 1024).toFixed(1)} KB`);
    if (match) { $("btnDl").disabled = false; $("btnCp").disabled = false; }
    else log("Download blocked on mismatch — re-run preflight + export.", "warn");
  } catch (e) {
    log("✗ Export failed: " + e.message, "err");
  } finally {
    $("btnAct").disabled = false;
  }
}

function download() {
  const stamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([csvText], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `live_trades_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  log("Download triggered: live_trades_" + stamp + ".csv", "ok");
}

async function copyCsv() {
  try {
    await navigator.clipboard.writeText(csvText);
    log("CSV copied to clipboard.", "ok");
  } catch (e) {
    log("Clipboard copy failed: " + e.message, "err");
  }
}
</script>
</body>
</html>
